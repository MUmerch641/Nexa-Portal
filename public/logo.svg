<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Blue Primary Gradient -->
    <linearGradient id="nexaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Metallic Highlight Gradient -->
    <linearGradient id="nexaLightShine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Dark 3D Shadow Gradient -->
    <linearGradient id="nexaDarkShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="nexaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Group with Drop Shadow (Background is 100% Transparent) -->
  <g filter="url(#nexaShadow)">
    
    <!-- === NEXA TOP ICON === -->
    <!-- Left Main Diagonal Pillar -->
    <path d="M 230,140 
             L 280,140 
             L 190,300 
             L 140,300 
             Z" 
          fill="url(#nexaBlueGrad)" />

    <path d="M 140,300 
             L 190,300 
             L 260,180 
             L 240,140 
             Z" 
          fill="url(#nexaLightShine)" />

    <!-- Center Fold Connecting Ribbon -->
    <path d="M 280,140 
             L 340,140 
             L 270,260 
             L 245,260 
             Z" 
          fill="url(#nexaDarkShadow)" />

    <!-- Right Vertical / Diagonal Pillar -->
    <path d="M 310,140 
             L 360,140 
             L 450,300 
             L 400,300 
             Z" 
          fill="url(#nexaBlueGrad)" />

    <path d="M 310,140 
             L 360,140 
             L 375,220 
             L 340,220 
             Z" 
          fill="url(#nexaLightShine)" />

    <!-- Outer Frame Wings matching NEXA icon design -->
    <path d="M 280,140 
             L 360,140 
             L 300,240 
             L 260,240 
             Z" 
          fill="url(#nexaBlueGrad)" />

    <!-- Iconic NEXA 'N' Geometric Structure -->
    <g transform="translate(45, 0)">
      <!-- Modern Sharp 3D 'N' Emblem -->
      <path d="M 180,130 L 225,130 L 305,270 L 305,130 L 345,130 L 345,300 L 300,300 L 220,160 L 220,300 L 180,300 Z" 
            fill="url(#nexaBlueGrad)" />
      
      <path d="M 225,130 L 305,270 L 300,300 L 220,160 Z" 
            fill="url(#nexaLightShine)" opacity="0.6"/>
    </g>

    <!-- === NEXA BRAND TEXT === -->
    <g transform="translate(70, 340)">
      <!-- N -->
      <path d="M 10,110 L 38,110 L 95,20 L 95,110 L 125,110 L 125,0 L 97,0 L 40,90 L 40,0 L 10,0 Z" 
            fill="url(#nexaBlueGrad)" />
      <!-- E -->
      <path d="M 145,110 L 245,110 L 245,83 L 177,83 L 177,65 L 235,65 L 235,40 L 177,40 L 177,27 L 242,27 L 242,0 L 145,0 Z" 
            fill="url(#nexaBlueGrad)" />
      <!-- X -->
      <path d="M 260,110 L 292,110 L 325,58 L 358,110 L 390,110 L 342,53 L 388,0 L 356,0 L 325,48 L 294,0 L 262,0 L 308,53 Z" 
            fill="url(#nexaBlueGrad)" />
      <!-- A -->
      <path d="M 405,110 L 436,110 L 447,82 L 493,82 L 504,110 L 535,110 L 484,0 L 456,0 Z M 457,57 L 470,24 L 483,57 Z" 
            fill="url(#nexaBlueGrad)" />
    </g>

  </g>
</svg>
